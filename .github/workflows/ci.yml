name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: php tests/run-tests.php

  # The documented no-Composer path: a fresh checkout, no vendor/, so
  # tests/run-tests.php has to run the suite through the TestCase shim in
  # tests/Support/testcase-shim.php. With vendor/ present the runner hands
  # over to PHPUnit, which is why the job above cannot catch a shim that has
  # fallen behind the assertions the suite uses.
  standalone-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: test ! -d vendor
      - run: php tests/run-tests.php

  probe:
    runs-on: ubuntu-latest
    needs: [ lint-and-unit, standalone-runner ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx wp-env start

      - name: Seed probe fixtures
        run: bash tests/probe/seed.sh
        env:
          WP_CMD: npx wp-env run --quiet cli wp

      # Master switch off: the shop behaves as normal retail. This must stay
      # green -- it proves the seed worked and the probe looks in the right
      # places, so a later "hidden" pass means something.
      - name: Probe with the master switch off (prices must be visible)
        run: |
          npx wp-env run --quiet cli wp option update pricecloak_enabled no
          npx wp-env run --quiet cli wp option update pricecloak_block_purchasing no
          python3 tests/probe/probe.py \
            --base-url http://localhost:8888 \
            --seed tests/probe/seed.json \
            --expect visible

      # Master switch on, purchasing left alone: guests must get no price from
      # any surface and must still be able to buy. Every surface the probe
      # judges passes as of T9, so this step is a hard gate: no
      # continue-on-error anywhere in this job from T10 on. Because a guest
      # can buy here, the probe also builds a guest cart and judges the cart
      # totals, the add-to-cart fragments and the Mini Cart block's state.
      - name: Probe with the master switch on (prices hidden, buying allowed)
        run: |
          npx wp-env run --quiet cli wp option update pricecloak_enabled yes
          npx wp-env run --quiet cli wp option update pricecloak_block_purchasing no
          python3 tests/probe/probe.py \
            --base-url http://localhost:8888 \
            --seed tests/probe/seed.json \
            --expect hidden

      # Same hidden run with the currency symbol printed after the amount
      # ("123.45 $"). WooCommerce builds a few labels with wc_price() directly
      # (the grouped product's sold-individually checkbox label, for one), and
      # the probe's currency test has to see the symbol on either side of the
      # digits for those to count as leaks. The seed's simple product is sold
      # individually precisely so this run renders that label.
      - name: Probe with the currency symbol on the right (prices hidden)
        run: |
          npx wp-env run --quiet cli wp option update woocommerce_currency_pos right_space
          python3 tests/probe/probe.py \
            --base-url http://localhost:8888 \
            --seed tests/probe/seed.json \
            --expect hidden
          npx wp-env run --quiet cli wp option update woocommerce_currency_pos left

      # Both switches on: the Purchasing module refuses every guest purchase.
      - name: Probe with purchasing blocked too (guests cannot buy)
        run: |
          npx wp-env run --quiet cli wp option update pricecloak_enabled yes
          npx wp-env run --quiet cli wp option update pricecloak_block_purchasing yes
          python3 tests/probe/probe.py \
            --base-url http://localhost:8888 \
            --seed tests/probe/seed.json \
            --expect hidden \
            --expect-purchasing blocked

      # One module off, everything else on. --modules-off tells the probe that
      # the json-ld surfaces are expected to go on showing prices, so the run
      # is green with those rows red on purpose. This is what proves the
      # per-module toggles really gate a single module and nothing else: drop
      # the flag and this same site fails on exactly those rows.
      - name: Probe with the structured data module switched off
        run: |
          npx wp-env run --quiet cli wp option update pricecloak_enabled yes
          npx wp-env run --quiet cli wp option update pricecloak_block_purchasing no
          npx wp-env run --quiet cli wp option update pricecloak_module_structured_data no
          python3 tests/probe/probe.py \
            --base-url http://localhost:8888 \
            --seed tests/probe/seed.json \
            --expect hidden \
            --modules-off structured_data
          npx wp-env run --quiet cli wp option update pricecloak_module_structured_data yes
